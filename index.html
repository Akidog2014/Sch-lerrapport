<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Formular</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h2 {
      background: #003366;
      color: white;
      padding: 10px;
      border-radius: 8px;
      font-size: 18px;
    }

    .field {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      box-sizing: border-box;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .hinweis {
      background: #fff8dc;
      border: 1px solid #e0c97f;
      padding: 15px;
      border-radius: 8px;
      margin-top: 20px;
      white-space: pre-line;
    }

    button {
      background: #003366;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 15px;
      width: 100%;
    }

    button:hover {
      background: #00509e;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="hinweis">- Schülerrapport für 10 – 15-jährige
- Infos: Gekoweisung 09.02.02
  </div>

  <h2>Beschuldigte Person</h2>

  <div class="field">
    <label>Name:</label>
    <input type="text" id="beschName">
  </div>

  <div class="field">
    <label>Vorname:</label>
    <input type="text" id="beschVorname">
  </div>

  <div class="field">
    <label>Geb. Datum:</label>
    <input type="text" id="gebDatum" placeholder="z.B. 01.01.2010">
  </div>

  <div class="field">
    <label>Adresse:</label>
    <input type="text" id="beschAdresse">
  </div>

  <h2>Schulpflichtig in</h2>

  <div class="field">
    <label>Ort / Schulhaus:</label>
    <input type="text" id="schulhaus">
  </div>

  <h2>Gesetzliche Vertretung</h2>

  <div class="field">
    <label>Name:</label>
    <input type="text" id="gesetzName">
  </div>

  <div class="field">
    <label>Vorname:</label>
    <input type="text" id="gesetzVorname">
  </div>

  <div class="field">
    <label>Telefonnummer:</label>
    <input type="tel" id="telefon">
  </div>

  <h2>Fahrzeug</h2>

  <div class="field">
    <label>Marke:</label>
    <input type="text" id="fahrzeugMarke">
  </div>

  <div class="field">
    <label>Kontrollschild:</label>
    <input type="text" id="kontrollschild">
  </div>

  <h2>Standort</h2>

  <div class="field">
    <label>Koordinaten / Aktuelle Adresse:</label>
    <textarea id="standort" readonly></textarea>
  </div>

  <button onclick="standortErmitteln()">
    Standort ermitteln
  </button>

  <h2>Widerhandlungen</h2>

  <div class="field">
    <label>Funktion:</label>

    <select id="funktion">
      <option value="">Bitte auswählen</option>
      <option value="Lenker">Lenker</option>
      <option value="Mitfahrer">Mitfahrer</option>
    </select>
  </div>

  <div class="field">
    <label>Widerhandlungen:</label>

    <textarea
      id="widerhandlungen"
      placeholder="Widerhandlungen eingeben..."></textarea>
  </div>

  <button onclick="emailVersenden()">
    E-Mail versenden
  </button>

</div>

<script>

async function standortErmitteln() {

  if (!navigator.geolocation) {
    alert("Geolocation wird auf diesem Gerät nicht unterstützt.");
    return;
  }

  navigator.geolocation.getCurrentPosition(

    async function(position) {

      const lat = position.coords.latitude;
      const lon = position.coords.longitude;

      let text = `Koordinaten:\n${lat}, ${lon}\n\n`;

      try {

        const response = await fetch(
          `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`
        );

        const data = await response.json();

        if (data.display_name) {
          text += `Adresse:\n${data.display_name}`;
        }

      } catch (error) {
        text += "Adresse konnte nicht ermittelt werden.";
      }

      document.getElementById("standort").value = text;
    },

    function(error) {
      alert("Standort konnte nicht ermittelt werden.");
    }
  );
}

function emailVersenden() {

  const betreff = "Schülerrapport";

const nachricht = `
Beschuldigte Person

Name: ${document.getElementById("beschName").value}
Vorname: ${document.getElementById("beschVorname").value}
Geb. Datum: ${document.getElementById("gebDatum").value}
Adresse: ${document.getElementById("beschAdresse").value}

Schulpflichtig in

Ort / Schulhaus: ${document.getElementById("schulhaus").value}

Gesetzliche Vertretung

Name: ${document.getElementById("gesetzName").value}
Vorname: ${document.getElementById("gesetzVorname").value}
Telefonnummer: ${document.getElementById("telefon").value}

Fahrzeug

Marke: ${document.getElementById("fahrzeugMarke").value}
Kontrollschild: ${document.getElementById("kontrollschild").value}

Standort

${document.getElementById("standort").value}

Widerhandlungen

Funktion: ${document.getElementById("funktion").value}

${document.getElementById("widerhandlungen").value}
`;

  const mailtoLink =
    `mailto:marco.wueest@lu.ch` +
    `?subject=${encodeURIComponent(betreff)}` +
    `&body=${encodeURIComponent(nachricht)}`;

  window.location.href = mailtoLink;
}

</script>

</body>
</html>
